name: Build SAO Add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build add-on
        run: python tools/build.py

      - name: Upload artifact (ดาวน์โหลดจากหน้า Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SAO_UI_Addon
          path: dist/*
          retention-days: 30

      - name: Create release (เฉพาะตอน push tag เช่น v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
